<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Dev Blog</title>
</head>

<body>
  <aside class="sidebar">
    <div class="sidebar__inner">
      <header class="sidebar__header">
        <h1 class="sidebar__logo">WJ's blog</h1>
        <div class="sidebar__profile">
          <img src="/profile.jpg" alt="프로필 이미지" class="profile">
        </div>
        <p class="sidebar__bio">Hi, my name is Woojoo Kim. </p>
        <ul class="social">
          <li class="social__item Github">
            <a href="">
              <img src="" alt="Github" class="social__img">
            </a>
          </li>
          <li class="social__item Jobkorea">
            <a href="">
              <img src="" alt="Jobkorea" class="social__img">
            </a>
          </li>
          <li class="social__item Saramin">
            <a href="">
              <img src="" alt="Saramin" class="social__img">
            </a>
          </li>
          <li class="social__item X">
            <a href="">
              <img src="" alt="X" class="social__img">
            </a>
          </li>
        </ul>
      </header>

      <hr class="line">

      <nav class="nav">
        <ul class="menu">
          <li class="menu__item">Home</li>
          <li class="menu__item">My Posts</li>
          <li class="menu__item">About me</li>
        </ul>
        <button class="btn">
          <a href="">Post</a>
        </button>
      </nav>
    </div>
  </aside>
  <div class="wrap">
    <header class="header"></header>
    <main class="main"></main>
    <footer class="footer"></footer>
  </div>
</body>

<script src="script.js"></script>

</html>
