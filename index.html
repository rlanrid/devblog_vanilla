<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <title>Dev Blog</title>
</head>

<body class="light">
  <aside class="sidebar">
    <div class="sidebar__inner">
      <header class="sidebar__header">
        <h1 class="sidebar__logo">WJ's blog</h1>
        <div class="sidebar__profile">
          <img src="/img/profile.jpg" alt="프로필 이미지" class="profile">
        </div>
        <p class="sidebar__bio">Hi, my name is Mike. </p>
        <ul class="social">
          <li class="social__item Github">
            <a href="">
              <img src="img/X.jpg" alt="X" class="social__img">
            </a>
          </li>
          <li class="social__item Jobkorea">
            <a href="">
              <img src="img/X.jpg" alt="X" class="social__img">
            </a>
          </li>
          <li class="social__item Saramin">
            <a href="">
              <img src="img/X.jpg" alt="X" class="social__img">
            </a>
          </li>
          <li class="social__item X">
            <a href="">
              <img src="img/X.jpg" alt="X" class="social__img">
            </a>
          </li>
          <li class="social__item X">
            <a href="">
              <img src="img/X.jpg" alt="X" class="social__img">
            </a>
          </li>
        </ul>
      </header>

      <nav class="nav" aria-label="주 메뉴">
        <ul class="menu">
          <li class="menu__item"><a href="/">Home</a></li>
          <li class="menu__item"><a href="/">My Posts</a></li>
          <li class="menu__item"><a href="/">Setting</a></li>
        </ul>
      </nav>
      <!-- nav -->

      <!-- todo: post write -->

      <section class="sidebar__tags" aria-labelledby="sidebar__tags-head">
        <h2 id="sidebar__tags-head" class="sr-only">태그 목록</h2>
        <ul class="sidebar__tag-list">
          <li class="sidebar__tag-item"><button data-tag="html">#HTML5</button></li>
          <li class="sidebar__tag-item"><button data-tag="css">#CSS</button></li>
          <li class="sidebar__tag-item"><button data-tag="javascript">#JavaScript</button></li>
          <li class="sidebar__tag-item"><button data-tag="react">#React</button></li>
          <li class="sidebar__tag-item"><button data-tag="vue">#Vue</button></li>
          <li class="sidebar__tag-item"><button data-tag="jqeury">#Jquery</button></li>
          <li class="sidebar__tag-item"><button data-tag="cs">#CS</button></li>
        </ul>
      </section>
      <!-- sidebar tags -->
    </div>
  </aside>
  <!-- sidebar -->

  <div class="wrap">
    <div class="overlay"></div>

    <header class="header">
      <div class="header__inner">
        <button class="hamburger" aria-label="메뉴" aria-expanded="false">
          <span></span>
        </button>
        <div class="header__intro">
          <h1 class="header__logo">DevBlog - A Blog For Developers</h1>
          <p class="header__subtitle">Welcome to my blog. Subscribe and get my latest blog post in your inbox.</p>
        </div>

        <form class="header__search" action="/" method="">
          <!-- <label for="header__select" class="sr-only">검색 대상</label>
          <select name="type" id="header__select" class="header__select">
            <option value="post">게시글</option>
            <option value="user">유저</option>
          </select> -->

          <label for="header__input" class="sr-only">검색어 입력</label>
          <input type="search" id="header__input" class="header__input" placeholder="Search for posts..." name="search">

          <button class="header__button">Search</button>
        </form>
      </div>
    </header>
    <!-- header -->

    <main class="main">
      <div class="post__inner">
        <div class="post__filtering" role="group" aria-label="게시글 정렬">
          <button type="button" data-sort="latest" class="is-active" aria-pressed="true">최신순</button>
          <button type="button" data-sort="views" aria-pressed="false">조회순</button>
        </div>
        <div class="post__list">
          <!-- post items -->
        </div>
      </div>
      <!-- post list -->

      <nav class="pagination">

      </nav>
      <!-- pagination -->
    </main>
    <!-- main -->


    <footer class="footer">
      <div class="footer__content">
        <p>이 사이트의 디자인은 Dribble을 참고하여 만들었습니다.</p>
        <p>© 2024 DevBlog. All rights reserved. | Built with Passion</p>
      </div>
    </footer>
    <!-- footer -->
  </div>
  <!-- wrap -->

  <button id="theme__toggle" class="theme__toggle-btn" aria-label="다크모드로 전환">🌙</button>
  <!-- theme toggle -->

  <script src="/JS/script.js" defer></script>
  <!-- script -->
</body>

</html>
