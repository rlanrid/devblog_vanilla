<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Dev Blog</title>
</head>

<body>
  <aside class="sidebar">
    <div class="sidebar__inner">
      <header class="sidebar__header">
        <h1 class="sidebar__logo">WJ's blog</h1>
        <div class="sidebar__profile">
          <img src="/profile.jpg" alt="프로필 이미지" class="profile">
        </div>
        <p class="sidebar__bio">Hi, my name is Woojoo Kim. </p>
        <ul class="social">
          <li class="social__item Github">
            <a href="">
              <img src="" alt="Github" class="social__img">
            </a>
          </li>
          <li class="social__item Jobkorea">
            <a href="">
              <img src="" alt="Jobkorea" class="social__img">
            </a>
          </li>
          <li class="social__item Saramin">
            <a href="">
              <img src="" alt="Saramin" class="social__img">
            </a>
          </li>
          <li class="social__item X">
            <a href="">
              <img src="" alt="X" class="social__img">
            </a>
          </li>
        </ul>
      </header>

      <hr class="line">

      <nav class="nav">
        <ul class="menu">
          <li class="menu__item">Home</li>
          <li class="menu__item">My Posts</li>
          <li class="menu__item">Setting</li>
        </ul>
        <a href="" class="btn">Post</a>
      </nav>
    </div>
  </aside>
  <div class="wrap">
    <header class="header">
      <div class="header__inner">
        <div class="header__intro">
          <h1 class="header__logo">DevBlog - A Blog For Developers</h1>
          <p class="header__subtitle">Welcome to my blog. Subscribe and get my latest blog post in your inbox.</p>
        </div>

        <form class="header__search" action="/search" method="">
          <label for="header__input">검색어 입력</label>
          <input type="search" id="header__input" class="header__input" placeholder="Search..." name="search">
        </form>
      </div>
    </header>
    <main class="main"></main>
    <footer class="footer"></footer>
  </div>
</body>

<script src="script.js"></script>

</html>
